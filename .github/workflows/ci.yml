name: TrendSphere Micro-Frontend CI/CD

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-and-build:
    name: Lint, Test & Build Micro-Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Type-Check & Lint
        run: npm run lint

      - name: Build Home Micro-Frontend (Port 3000)
        run: npm run build:home

      - name: Build Cart Micro-Frontend (Port 3001)
        run: npm run build:cart

  docker-build:
    name: Docker Multi-Stage Verification
    runs-on: ubuntu-latest
    needs: validate-and-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Config
        run: docker compose config

      - name: Build Multi-Stage Production Images
        run: docker compose build
